# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Publishes to npm when a GitHub release is published.
#
# Flow: `bun run release` pushes a release commit + tag and opens a draft
# GitHub release. A human edits the notes and publishes the release, which
# triggers this workflow. Publishing authenticates via npm trusted publishing
# (OIDC) — no npm token exists anywhere — and npm attaches provenance
# attestations automatically.
#
# One-time npm setup (package settings on npmjs.com):
#   Trusted Publisher: GitHub — owner langfuse, repo langfuse-cli,
#   workflow release.yml, environment npm-publish.
name: Release

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC credential for npm trusted publishing

    steps:
      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag, version, and prerelease consistency
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version package.json)"
          if [ "$TAG_NAME" != "v$VERSION" ]; then
            echo "::error::release tag $TAG_NAME does not match package.json version $VERSION"
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::released commit is not on main"
            exit 1
          fi
          case "$VERSION" in
            *-*)
              if [ "$IS_PRERELEASE" != "true" ]; then
                echo "::error::prerelease version $VERSION must be published as a GitHub pre-release"
                exit 1
              fi
              IDENTIFIER="${VERSION#*-}"
              IDENTIFIER="${IDENTIFIER%%.*}"
              case "$IDENTIFIER" in
                alpha|beta|rc) DIST_TAG="$IDENTIFIER" ;;
                *)
                  echo "::error::unsupported prerelease identifier \"$IDENTIFIER\" (expected alpha, beta, or rc)"
                  exit 1
                  ;;
              esac
              ;;
            *)
              if [ "$IS_PRERELEASE" != "false" ]; then
                echo "::error::stable version $VERSION must not be marked as a GitHub pre-release"
                exit 1
              fi
              DIST_TAG="latest"
              ;;
          esac
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"
          echo "Publishing $VERSION with npm dist-tag $DIST_TAG"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          # This workflow publishes an artifact; never restore caches into it.
          no-cache: true

      - name: Install dependencies
        run: bun ci

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Build and fake-call every endpoint in every API snapshot
        run: bun run conformance:all

      - name: Set up Node (bundles the npm that performs the publish)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # This workflow publishes an artifact; never restore caches into it.
          package-manager-cache: false

      - name: Verify npm supports trusted publishing (requires npm >= 11.5.1)
        run: |
          set -euo pipefail
          NPM_VERSION="$(npm --version)"
          MINIMUM="11.5.1"
          if [ "$(printf '%s\n' "$MINIMUM" "$NPM_VERSION" | sort -V | head -n1)" != "$MINIMUM" ]; then
            echo "::error::npm $NPM_VERSION is too old for trusted publishing (need >= $MINIMUM)"
            exit 1
          fi
          echo "npm $NPM_VERSION"

      # conformance:all already built dist/; --ignore-scripts avoids a second
      # prepublishOnly build producing a different publish than was verified.
      - name: Publish to npm
        run: npm publish --ignore-scripts --tag "$DIST_TAG"
