# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# CI stages both packages with OIDC; maintainers approve on npm with 2FA.
# Keep npm-publish protected. Allow v* tags, plus main for manual tag recovery.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to stage (for recovery)
        required: true
        type: string

permissions: {}

# One group per release: parallel releases of different tags may queue and
# run independently; re-deliveries of the same tag serialize. A shared fixed
# group would silently cancel a superseded pending release run.
concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Stage packages on npm
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC credential for npm trusted publishing

    env:
      TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ env.TAG_NAME }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify published GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE="$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease)"
          jq -e '.tagName == env.TAG_NAME and .isDraft == false' <<< "$RELEASE"
          echo "IS_PRERELEASE=$(jq -r '.isPrerelease' <<< "$RELEASE")" >> "$GITHUB_ENV"

      - name: Verify released commit is on main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::released commit is not on main"
            exit 1
          fi
          RELEASE_SHA="$(git rev-parse HEAD)"
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
          echo "Release commit: $RELEASE_SHA"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          # This workflow publishes an artifact; never restore caches into it.
          no-cache: true

      - name: Install dependencies
        run: bun ci

      # Shared policy with scripts/release.ts validates both package identities,
      # tag <-> version binding, prerelease consistency, identifier whitelist,
      # channel monotonicity, and safe partial-publish recovery.
      - name: Verify release policy and derive staging plan
        run: |
          set -euo pipefail
          RELEASE_PLAN="$(bun scripts/release-guard.ts --json)"
          DIST_TAG="$(jq -r '.distTag' <<< "$RELEASE_PLAN")"
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"
          echo "Staging with npm dist-tag $DIST_TAG"
          jq '.packages' <<< "$RELEASE_PLAN"

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Build and fake-call every endpoint in every API snapshot
        run: bun run conformance:all

      - name: Set up Node (bundles the npm that performs the publish)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # This workflow publishes an artifact; never restore caches into it.
          package-manager-cache: false

      - name: Verify npm supports staged publishing (requires npm >= 11.15.0)
        run: |
          set -euo pipefail
          NPM_VERSION="$(npm --version)"
          MINIMUM="11.15.0"
          if [ "$(printf '%s\n' "$MINIMUM" "$NPM_VERSION" | sort -V | head -n1)" != "$MINIMUM" ]; then
            echo "::error::npm $NPM_VERSION is too old for staged publishing (need >= $MINIMUM)"
            exit 1
          fi
          echo "npm $NPM_VERSION"

      # Stage two package roots from the one verified build. The canonical
      # package receives README.md; the legacy package receives the migration
      # README under that same filename on npm.
      - name: Prepare canonical and legacy npm packages
        run: |
          set -euo pipefail
          PACKAGE_ROOT="$GITHUB_WORKSPACE/.npm-packages"
          bun scripts/npm-packages.ts "$PACKAGE_ROOT" "$RELEASE_SHA"
          echo "PACKAGE_ROOT=$PACKAGE_ROOT" >> "$GITHUB_ENV"

      # npm staging does not verify tarball completeness; a files-array,
      # README selection, or build-layout regression must fail here.
      - name: Verify both packed tarballs
        run: |
          set -euo pipefail
          for package in canonical legacy; do
            FILES="$(npm pack --dry-run --json --ignore-scripts "$PACKAGE_ROOT/$package" | jq -r '.[0].files[].path')"
            for required in LICENSE bin/langfuse.mjs dist/cli.js dist/contracts/catalog.json README.md; do
              if ! grep -qx "$required" <<< "$FILES"; then
                echo "::error::$required is missing from the $package npm tarball"
                exit 1
              fi
            done
          done
          test "$(jq -r '.name' "$PACKAGE_ROOT/canonical/package.json")" = "@langfuse/cli"
          test "$(jq -r '.name' "$PACKAGE_ROOT/legacy/package.json")" = "langfuse-cli"
          cmp README.md "$PACKAGE_ROOT/canonical/README.md"
          cmp npm/legacy/README.md "$PACKAGE_ROOT/legacy/README.md"
          diff -qr "$PACKAGE_ROOT/canonical/bin" "$PACKAGE_ROOT/legacy/bin"
          diff -qr "$PACKAGE_ROOT/canonical/dist" "$PACKAGE_ROOT/legacy/dist"
          echo "Both tarballs verified."

      - name: Smoke-test the built CLI under Node and Bun
        run: |
          set -euo pipefail
          node bin/langfuse.mjs --version
          bun bin/langfuse.mjs --help > /dev/null
          echo "Smoke test passed."

      # The early guard ran before ~5 minutes of gates; re-check against the
      # registry state at publish time so a release published in that window
      # cannot slip a dist-tag backwards (per-tag concurrency does not
      # serialize different releases against each other).
      - name: Re-verify release policy immediately before staging
        run: |
          set -euo pipefail
          FINAL_PLAN="$(bun scripts/release-guard.ts --json)"
          FINAL_TAG="$(jq -r '.distTag' <<< "$FINAL_PLAN")"
          if [ "$FINAL_TAG" != "$DIST_TAG" ]; then
            echo "::error::dist-tag changed between verification and publish ($DIST_TAG -> $FINAL_TAG)"
            exit 1
          fi
          echo "FINAL_PLAN=$FINAL_PLAN" >> "$GITHUB_ENV"
          jq '.packages' <<< "$FINAL_PLAN"

      # conformance:all already built dist/; --ignore-scripts avoids a second
      # prepublishOnly build producing a different publish than was verified.
      # Provenance names the checked-out tag even during a dispatch from main.
      # Pending-stage conflicts fail closed. Approve or reject the existing
      # stage on npm before retrying; already published packages are skipped.
      - name: Stage @langfuse/cli on npm
        run: |
          set -euo pipefail
          STATUS="$(jq -r '.packages.canonical.status' <<< "$FINAL_PLAN")"
          VERSION="$(jq -r '.version' <<< "$FINAL_PLAN")"
          if [ "$STATUS" = "already-published" ]; then
            echo "@langfuse/cli@$VERSION was already published from this release; skipping."
          else
            GITHUB_SHA="$RELEASE_SHA" GITHUB_REF="refs/tags/$TAG_NAME" npm stage publish "$PACKAGE_ROOT/canonical" --ignore-scripts --tag "$DIST_TAG"
          fi

      - name: Stage langfuse-cli compatibility package on npm
        run: |
          set -euo pipefail
          STATUS="$(jq -r '.packages.legacy.status' <<< "$FINAL_PLAN")"
          VERSION="$(jq -r '.version' <<< "$FINAL_PLAN")"
          if [ "$STATUS" = "already-published" ]; then
            echo "langfuse-cli@$VERSION was already published from this release; skipping."
          else
            GITHUB_SHA="$RELEASE_SHA" GITHUB_REF="refs/tags/$TAG_NAME" npm stage publish "$PACKAGE_ROOT/legacy" --ignore-scripts --tag "$DIST_TAG"
          fi

      - name: Report staging result
        run: |
          VERSION="$(jq -r '.version' <<< "$FINAL_PLAN")"
          echo "Release $VERSION staged (or already published). Review both packages in npm's Staged Packages tab and approve with 2FA. Stage IDs are in the upload logs." >> "$GITHUB_STEP_SUMMARY"
